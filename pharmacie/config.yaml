name: Pharmacie
version: "0.1.0"
slug: pharmacie
description: >-
  L'armoire à pharmacie de la maison : ce qu'on a, ce qui périme, et quoi utiliser
  selon les petits maux des adultes.
url: https://github.com/antoine28boel/homepharmacy
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:medical-bag
panel_title: Pharmacie
# La pharmacie sert à tout le foyer : le panneau est visible des comptes non administrateurs.
panel_admin: false
homeassistant_api: true
map:
  - type: media
    read_only: false
watchdog: http://[HOST]:[PORT:8099]/api/health
